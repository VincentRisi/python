openapi: 3.0.1
info:
  title: DepositAccountsFinancials
  description: This is the RESTful API to process financial requests for a Current
    account or Savings account as part of the GDP or CASA systems
  contact:
    name: Dimitris Raxenidis
    email: dimitrisr@Nedbank.co.za
  version: 3.1.0
  x-swaggerversion: "2"
  x-swaggercreationdate: 27-03-2024
servers:
- url: /paymentordermanagement/depositaccountsfinancials/v3
security:
- API Key: []
  API Secret: []
paths:
  /accounttypes/{accounttype}/accounts/{accountnumber}/financials/transactions:
    post:
      tags:
      - CreateFinancialTransaction
      summary: Post a financial transaction against an account
      description: Create a debit or credit financial transaction against an account
      operationId: CreateFinancialTransaction
      parameters:
      - name: Acccept-Language
        in: header
        description: The accepted language of the user and country code
        required: true
        schema:
          type: string
      - name: x-ned-transaction-id
        in: header
        description: a transaction id initiated from the front-end
        required: true
        schema:
          type: string
          format: uuid
      - name: x-ned-tenant-code
        in: header
        description: "For example: ZANBL = Nedbank Limited, ZADIL = Depfin Investments\
          \ Proprietary Limited"
        required: true
        schema:
          type: string
      - name: accounttype
        in: path
        description: |-
          Account Type classifies the valid set of Account Arrangements
          NCA - Current account
          NSA - Savings account
          NDS - Investmant Account
        required: true
        schema:
          maxLength: 3
          minLength: 3
          type: string
      - name: accountnumber
        in: path
        description: |-
          Unique Identifier for the account type within the relevant source system
          Account number
        required: true
        schema:
          maxLength: 23
          minLength: 23
          type: string
      requestBody:
        description: The details of the financial transaction
        content:
          application/json; charset=utf-8:
            schema:
              $ref: '#/components/schemas/CreateFinTranRequest'
        required: true
      responses:
        "201":
          description: Created. Request successfully executed
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/CreateFinTranResponse'
      x-codegen-request-body-name: createfintranrequest
  /accounttypes/{accounttype}/accounts/{accountnumber}/financials/statuses/enquiries:
    post:
      tags:
      - GetAccountFinancialStatus
      summary: Verify the financial status of an account
      description: "Verify the financial status of an account, transactions allowed,\
        \ debit/credit allowed"
      operationId: GetAccountFinancialStatus
      parameters:
      - name: Acccept-Language
        in: header
        description: The accepted language of the user and country code
        required: true
        schema:
          type: string
      - name: x-ned-transaction-id
        in: header
        description: a transaction id initiated from the front-end
        required: true
        schema:
          type: string
          format: uuid
      - name: x-ned-tenant-code
        in: header
        description: "For example: ZANBL = Nedbank Limited, ZADIL = Depfin Investments\
          \ Proprietary Limited"
        required: true
        schema:
          type: string
      - name: accounttype
        in: path
        description: |-
          Account Type classifies the valid set of Account Arrangements
          NCA - Current account
          NSA - Savings account
          NDS - Investmant Account
        required: true
        schema:
          maxLength: 3
          minLength: 3
          type: string
      - name: accountnumber
        in: path
        description: |-
          Unique Identifier for the account type within the relevant source system
          Account number
        required: true
        schema:
          maxLength: 23
          minLength: 23
          type: string
      requestBody:
        content:
          application/json; charset=utf-8:
            schema:
              $ref: '#/components/schemas/GetAccountFinancialStatusRequest'
        required: true
      responses:
        "201":
          description: Created. Request successfully executed
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/GetAcctFinStatusResponse'
      x-codegen-request-body-name: getAccountFinancialStatus
  /accounttypes/{accounttype}/accounts/{accountnumber}/financials/trackings/cancelations:
    post:
      tags:
      - CancelTracking
      description: CancelTracking
      operationId: CancelTracking
      parameters:
      - name: Acccept-Language
        in: header
        description: The accepted language of the user and country code
        required: true
        schema:
          type: string
      - name: x-ned-transaction-id
        in: header
        description: a transaction id initiated from the front-end
        required: true
        schema:
          type: string
          format: uuid
      - name: x-ned-tenant-code
        in: header
        description: "For example: ZANBL = Nedbank Limited, ZADIL = Depfin Investments\
          \ Proprietary Limited"
        required: true
        schema:
          type: string
      - name: accounttype
        in: path
        description: |-
          Account Type classifies the valid set of Account Arrangements
          NCA - Current account
          NSA - Savings account
          NDS - Investmant Account
        required: true
        schema:
          maxLength: 3
          minLength: 3
          type: string
      - name: accountnumber
        in: path
        description: |-
          Unique Identifier for the account type within the relevant source system
          Account number
        required: true
        schema:
          maxLength: 23
          minLength: 23
          type: string
      requestBody:
        content:
          application/json; charset=utf-8:
            schema:
              $ref: '#/components/schemas/CancelTrackingRequest'
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/CancelTrackingResponse'
      x-codegen-request-body-name: CancelTracking
components:
  schemas:
    CancelTrackingRequest:
      required:
      - creditTrackingStrikeDate
      - paymentId
      - sourceSystem
      type: object
      properties:
        creditTrackingStrikeDate:
          type: string
          format: date
        paymentId:
          $ref: '#/components/schemas/PaymentId'
        sourceSystem:
          $ref: '#/components/schemas/System_Type'
    CancelTrackingResponse:
      required:
      - resultSet
      type: object
      properties:
        resultSet:
          $ref: '#/components/schemas/ResultSet'
        accountType:
          maxLength: 3
          minLength: 3
          type: string
        accountNo:
          $ref: '#/components/schemas/AccountNo'
        paymentId:
          $ref: '#/components/schemas/PaymentId'
        sourceSystem:
          $ref: '#/components/schemas/System_Type'
        creditTrackingStrikeDate:
          type: string
          format: date
    AccountNo:
      type: string
      description: Unique Identifier for an account that is part of the transfer.
    PaymentId:
      type: string
    GetAccountFinancialStatusRequest:
      required:
      - transactionValidationInstruction
      type: object
      properties:
        paymentType:
          $ref: '#/components/schemas/CodeDescription_Type'
        transactionValidationInstruction:
          $ref: '#/components/schemas/TransactionValidationInstruction_Type'
        externalChannel:
          $ref: '#/components/schemas/CodeDescription_Type'
        productSystem:
          $ref: '#/components/schemas/ProductSystem_Type'
        tranCodeSourceSystem:
          $ref: '#/components/schemas/System_Type'
        unpaidPayment:
          $ref: '#/components/schemas/UnpaidPayment_Type'
        clientIdentification:
          $ref: '#/components/schemas/ClientIdentifications'
        additionalInformation:
          $ref: '#/components/schemas/AdditionalInformation'
    AdditionalInformation:
      type: array
      items:
        $ref: '#/components/schemas/AdditionalProperty'
    AdditionalProperty:
      type: object
      properties:
        context:
          maxLength: 100
          minLength: 100
          type: string
        value:
          maxLength: 100
          minLength: 100
          type: string
      description: |-
        A property-value pair representing an additional characteristics of the entitity, e.g. a product feature or another characteristic for which there is no matching property in schema.org.
        Note: Publishers should be aware that applications designed to use specific schema.org properties (e.g. http://schema.org/width, http://schema.org/color, http://schema.org/gtin13, ...) will typically expect such data to be provided using those properties, rather than using the generic property/value mechanism
    TransactionValidationInstruction_Type:
      required:
      - transactionEffect
      - transactionValidationType
      type: object
      properties:
        transactionValidationType:
          $ref: '#/components/schemas/CodeDescription_Type'
        transactionType:
          $ref: '#/components/schemas/CodeDescription_Type'
        transactionAmount:
          $ref: '#/components/schemas/Amount_Type'
        transactionEffect:
          $ref: '#/components/schemas/TransactionEffect'
        entryClassificationType:
          $ref: '#/components/schemas/CodeDescription_Type'
        interbankTransactionFlag:
          type: boolean
    TransactionEffect:
      type: object
      properties:
        value:
          maxLength: 3
          minLength: 3
          type: string
      description: "It is used to determine where to put the amount - which column\
        \ (sign) for transaction instruction request.\r\n"
    ClientIdentification:
      type: object
      properties:
        clientIdentifier:
          $ref: '#/components/schemas/ClientIdentifier'
        clientIdType:
          $ref: '#/components/schemas/CodeDescription_Type'
    ClientIdentifier:
      maxLength: 36
      minLength: 36
      type: string
      description: "This identifier contains the unique number or code used to uniquely\
        \ or form part of a unique identifier used to identify a business object at\
        \ an enterprise level.&lt;br&gt;For Example, a FinancialTransactionCard contains\
        \ both a Card Number and a CCV number.&lt;br&gt;This Identifier is used in\
        \ conjunction with its EnterpriseIdentifier subclass. The EnterpriseIdentifier\
        \ subclass contains a enterpriseIdType which must be used to specify the type\
        \ of the identifier.&lt;br&gt;For Example, FinancialDocumentIdentifier.enterpriseIdType.FinTransCardCCV.\
        \ FinancialDocumentIdentifier inherits from EnterpriseIdentifier."
