      required:
      - additionalInformation
      - description
      - transactionAmount
      - transactionDate
      - transactionEffect
      - transactionId
      - transactionType
      type: object
      properties:
        transactionId:
          maxLength: 36
          minLength: 36
          type: string
          description: Unique transaction GUID across all transactions.
        transactionDate:
          type: string
          description: Date on which the transaction / query is triggered. This field
            is to ensure miR is picking up the correct fee configured for that date.
            This is a non-mandatory field. Format 2022-03-23T12:07:42.353Z
          format: date-time
        transactionType:
          $ref: '#/components/schemas/CodeDescription_Type'
        transactionEffect:
          maxLength: 3
          minLength: 3
          type: string
          description: "Distinguishes between Entries based on whether they increase\
            \ or decrease the balance of an Account\nAllowed Values : \n�DRO� - Debit\n\
            �CRO� - Credit \n�DRR� - Debit reversal \n�CRR� - Credit reversal "
        description:
          maxLength: 1020
          minLength: 1020
          type: string
          description: Transaction narrative
        transactionAmount:
          $ref: '#/components/schemas/Amount_Type'
        additionalInformation:
          maxLength: 3
          minLength: 3
          type: string
          description: "Additional Information for a Transaction. \n�ALL� - Apply\
            \ all checks (use as default) \n�BSD� - Bypass account status, block debit\
            \ order and insufficient funds checks \n�BAL� - Bypass Insufficient Funds\
            \ check"
        accountTransactionSource:
          $ref: '#/components/schemas/AccountTransactionSource'
        transactionCashAmount:
          $ref: '#/components/schemas/Amount_Type'
        transactionGroupId:
          maxLength: 36
          minLength: 36
          type: string
          description: This is an Identifier to group related  transactions togeher.
        transactionReservationType:
          $ref: '#/components/schemas/CodeDescription_Type'
        interBankTransactionFlag:
          type: boolean
          description: Interbank Indicator. Should be set to �Y� if transaction involves
            other Bank�s account.
        entryClassificationType:
          $ref: '#/components/schemas/CodeDescription_Type'
        transactionPaymentModeType:
          $ref: '#/components/schemas/CodeDescription_Type'
        chequeNumber:
          type: number
          format: int32
        saswitchFlag:
          type: boolean
        transactionPaymentDirectionType:
          $ref: '#/components/schemas/CodeDescription_Type'
      description: Identifies a Transaction that has an impact on an Account Balance.
        The net sum of all PostingEntrys of a Transaction must be zero in each currency
        involved in the Transaction.
