          $ref: '#/components/schemas/ResultSet'
        partyId:
          type: string
        actionList:
          $ref: '#/components/schemas/ActionList'
        derivedBalance:
          $ref: '#/components/schemas/Value_Type'
    ProductSystem_Type:
      type: object
      properties:
        productSystemID:
          maxLength: 6
          minLength: 1
          type: string
          description: "The ID of the product source system where this product is\
            \ managed. Management of a product implies management of the instances\
            \ of a product, from the time the product instance is activated to the\
            \ time it is deactivated, if applicable."
      description: "A product source system where this product is managed. Management\
        \ of a product implies management of the instances of a product, from the\
        \ time the product instance is activated to the time it is deactivated, if\
        \ applicable."
    ResultSet:
      required:
      - resultCode
      type: object
      properties:
