      required:
      - sourceSystemID
      type: object
      properties:
        sourceSystemID:
          maxLength: 6
          minLength: 1
          type: string
          description: |-
            The source system identifier
            Channel ID
        accountTransactionID:
          maxLength: 36
          minLength: 36
          type: string
          description: |-
            The transaction identifier used by the source system
            Original Transaction GUID
      description: The source system which is responsible for this transaction
    ActionItem:
      type: object
      properties:
        action:
          maxLength: 3
          minLength: 3
          type: string
          description: |-
            Action which may or may not be available
            Debit/credit valid indicator
            UNK = Not known
            DBT = Debit transactions allowed only
            CRT = Credit transactions allowed only
            CAD = Both debit and credit transactions allowed
      description: The financial actions that can be taken against the specified account
    ActionList:
      maxItems: 4
      minItems: 0
      type: array
      description: A list of financial actions that can be taken against the specified
        account
      items:
        $ref: '#/components/schemas/ActionItem'
    CreateFinTranRq:
      type: object
      properties:
        createFinTran:
          $ref: '#/components/schemas/CreateFinTran'
      additionalProperties: false
    CreateFinTranRs:
      required:
      - resultSet
      type: object
      properties:
        resultSet:
          $ref: '#/components/schemas/ResultSet'
        derivedBalance:
          $ref: '#/components/schemas/Value_Type'
    Value_Type:
      type: object
      properties:
        value:
          type: number
          format: decimal
        creditDebitIndicator:
          type: string
        unitOfMeasure:
