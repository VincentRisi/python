        "Approving Employee Number" - Employee 2 (Approver)
        "Capturing Employee Number" - Employee 1 (Capturer)
      items:
        $ref: '#/components/schemas/UserIdentification'
    UserIdentification:
      type: object
      properties:
        userIdType:
          maxLength: 30
