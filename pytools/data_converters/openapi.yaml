    System_Type:
      type: object
      properties:
        systemId:
          maxLength: 10
          minLength: 1
          type: string
          description: The unique identifier of the System.
    CodeDescription_Type:
      type: object
      properties:
        code:
          type: string
    ClientIdentifications:
      type: array
      items:
        $ref: '#/components/schemas/ClientIdentification'
    TransactionAccumulation_Type:
      type: object
      properties:
        accumulationPreferenceType:
          $ref: '#/components/schemas/CodeDescription_Type'
        accumulationNarrative:
          maxLength: 1020
          minLength: 1
          type: string
          description: This field will contain the Accumulation narrative and it is
            a mandatory field in case accumulation flag is set to "Y".
        accumulationPreferences:
          $ref: '#/components/schemas/AccumulationPreferences'
        sourceSystem:
          $ref: '#/components/schemas/System_Type'
        accumulationBatchDate:
          maxLength: 10
          minLength: 10
          type: string
    AccumulationPreferences:
      minItems: 0
      type: array
      items:
        $ref: '#/components/schemas/Preference_Type'
    Preference_Type:
      type: object
      properties:
        preferenceType:
          $ref: '#/components/schemas/CodeDescription_Type'
        preferenceValue:
          maxLength: 200
          minLength: 200
          type: string
