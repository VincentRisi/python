  System_Type:
    type: object
    properties:
      systemId:
        description: The unique identifier of the System.
        type: string
        minLength: 1
        maxLength: 10
  CodeDescription_Type:
    type: object
    properties:
      code:
        type: string
  ClientIdentifications:
    type: array
    items:
        $ref: '#/definitions/ClientIdentification'
  TransactionAccumulation_Type:
    type: object
    properties:
      accumulationPreferenceType:
        $ref: '#/definitions/CodeDescription_Type'
      accumulationNarrative:
        description: This field will contain the Accumulation narrative and it is a mandatory field in case accumulation flag is set to "Y".
        type: string
        minLength: 1
        maxLength: 1020
      accumulationPreferences:
        $ref: '#/definitions/AccumulationPreferences'
      sourceSystem:
        $ref: '#/definitions/System_Type'
      accumulationBatchDate:
        type: string
        minLength: 10
        maxLength: 10
  AccumulationPreferences:
    minItems: 0
    type: array
    items:
      $ref: '#/definitions/Preference_Type'
  Preference_Type:
    type: object
    properties:
      preferenceType:
        $ref: '#/definitions/CodeDescription_Type'
      preferenceValue:
        type: string
        minLength: 200
        maxLength: 200
  AccountTransactionSource:
    description: The source system which is responsible for this transaction
    type: object
    required:
      - sourceSystemID
    properties:
      sourceSystemID:
        description: |-
          The source system identifier
          Channel ID
        type: string
        minLength: 1
        maxLength: 6
      accountTransactionID:
        description: |-
          The transaction identifier used by the source system
          Original Transaction GUID
        type: string
        minLength: 36
        maxLength: 36  
  ActionItem:
    description: The financial actions that can be taken against the specified account
    type: object
    properties:
      action:
        description: |-
          Action which may or may not be available
          Debit/credit valid indicator
          UNK = Not known
          DBT = Debit transactions allowed only
          CRT = Credit transactions allowed only
          CAD = Both debit and credit transactions allowed
        type: string
        minLength: 3
        maxLength: 3
  ActionList:
    description: A list of financial actions that can be taken against the specified
      account
    type: array
    items:
      $ref: '#/definitions/ActionItem'
    minItems: 0
    maxItems: 4
  CreateFinTranRq:
    properties:
      createFinTran:
        $ref: '#/definitions/CreateFinTran'
    additionalProperties: false
  CreateFinTranRs:
    type: object
    properties:
      resultSet:
        $ref: '#/definitions/ResultSet'
      derivedBalance:
        $ref: '#/definitions/Value_Type'        
    required:
    - resultSet
  Value_Type:
    type: object
    properties:
      value:
        type: number
        format: decimal
      creditDebitIndicator:
        type: string
      unitOfMeasure:
        type: string    
  UnpaidPayment_Type:
    type: object
    properties:
      unpaidPaymentReasonType:
        $ref: '#/definitions/CodeDescription_Type'
      updateNarrative:
        type: string
      unpaidOriginatingBranchCode:
        description: Unpaid Originated Branch
        type: string
  AccountTransaction:
    required:
      - transactionId
      - transactionDate
      - transactionType
      - transactionEffect
      - description
      - transactionAmount
      - additionalInformation
    description: Identifies a Transaction that has an impact on an Account Balance. The net sum of all PostingEntrys of a Transaction must be zero in each currency involved in the Transaction.
    type: object
    properties:
      transactionId:
        description: Unique transaction GUID across all transactions.
        type: string
        minLength: 36
        maxLength: 36
      transactionDate:
        description: Date on which the transaction / query is triggered. This field is to ensure miR is picking up the correct fee configured for that date. This is a non-mandatory field. Format 2022-03-23T12:07:42.353Z 
        type: string
        format: date-time
      transactionType:
        $ref: '#/definitions/CodeDescription_Type'
      transactionEffect:
        description: |-
          Distinguishes between Entries based on whether they increase or decrease the balance of an Account
          Allowed Values : 
          “DRO” - Debit
          “CRO” - Credit 
          “DRR” - Debit reversal 
          “CRR” - Credit reversal 
        type: string
        minLength: 3
        maxLength: 3
      description:
        description: Transaction narrative
        type: string
        minLength: 1020
        maxLength: 1020
      transactionAmount:
        $ref: '#/definitions/Amount_Type'
      additionalInformation:
        description: |-
          Additional Information for a Transaction. 
          “ALL” - Apply all checks (use as default) 
          “BSD” - Bypass account status, block debit order and insufficient funds checks 
          “BAL” - Bypass Insufficient Funds check
        type: string
        minLength: 3
        maxLength: 3
      accountTransactionSource:
        $ref: '#/definitions/AccountTransactionSource'
      transactionCashAmount:
        $ref: '#/definitions/Amount_Type'
      transactionGroupId:
        description: This is an Identifier to group related  transactions togeher.
        type: string
        minLength: 36
        maxLength: 36
      transactionReservationType:
        $ref: '#/definitions/CodeDescription_Type'
      interBankTransactionFlag:
        description: Interbank Indicator. Should be set to “Y” if transaction involves other Bank’s account.
        type: boolean
      entryClassificationType:
        $ref: '#/definitions/CodeDescription_Type'
      transactionPaymentModeType:
        $ref: '#/definitions/CodeDescription_Type'
      chequeNumber:
        type: number
        format: int32
      saswitchFlag:
        type: boolean
      transactionPaymentDirectionType:
        $ref: '#/definitions/CodeDescription_Type'
  CreateFinTran:
    required:
      - accountTransaction
      - clientIdentification
      - debitOrderTracking
      - externalChannel
      - paymentType
      - productSystem
      - sourceSystem
    type: object
    properties:
      accountTransaction:
        $ref: '#/definitions/AccountTransaction'
      userIdentification:
        $ref: '#/definitions/UserIdentificationList'
      productSystem:
        $ref: '#/definitions/ProductSystem_Type'
      sourceSystem:
        $ref: '#/definitions/System_Type'
      transactionAccumulation:
        $ref: '#/definitions/TransactionAccumulation_Type'
      unpaidPayment:
        $ref: '#/definitions/UnpaidPayment_Type'
      paymentType:
        $ref: '#/definitions/CodeDescription_Type'
      externalChannel:
        description: Identifies a conduit through which products and services are made available to a customer and by which the financial organization and Customers communicate with each other, e.g. Nedbank ATM, Branch, USSD, Self Service Kiosk etc.
        $ref: '#/definitions/CodeDescription_Type'
      clientIdentification:
        $ref: '#/definitions/ClientIdentifications'   
      tranCodeSourceSystem:
        $ref: '#/definitions/System_Type'   
      chargeAccountTenantCode:
        type: string
      chargeAccount:
        $ref: '#/definitions/AccountId_Type'   
      additionalInformation:
        $ref: '#/definitions/AdditionalInformation'
  AccountId_Type:
    type: object
    properties:
      accountType:
        type: string
      accountNumber:
        type: string
      accountSortCode:
        type: integer
    required:
    - accountNumber
  GetAcctFinStatusRs:
    type: object
    properties:
      resultSet:
        $ref: '#/definitions/ResultSet'
      partyId:
        type: string
      actionList:
        $ref: '#/definitions/ActionList'
      derivedBalance:
        $ref: '#/definitions/Value_Type'  
    required:
    - resultSet
  ProductSystem_Type:
    description: A product source system where this product is managed. Management of a product implies management of the instances of a product, from the time the product instance is activated to the time it is deactivated, if applicable.
    type: object
    properties:
      productSystemID:
        description: The ID of the product source system where this product is managed. Management of a product implies management of the instances of a product, from the time the product instance is activated to the time it is deactivated, if applicable.
        type: string
        minLength: 1
        maxLength: 6
