swagger: "2.0"
info:
  description: This is the RESTful API to process financial requests for a Current
    account or Savings account as part of the GDP or CASA systems
  version: 3.1.0
  title: DepositAccountsFinancials
  contact:
    name: Dimitris Raxenidis
    email: dimitrisr@Nedbank.co.za
  x-swaggerversion: "2"
  x-swaggercreationdate: 27-03-2024
schemes:
- https
basePath: /paymentordermanagement/depositaccountsfinancials/v3
consumes:
- application/json; charset=utf-8
produces:
- application/json; charset=utf-8
parameters:
  # Global default Headers for Multis and Deep
  AcceptLanguage:
    name: Acccept-Language
    in: header
    required: true
    type: string
    description: The accepted language of the user and country code
  GlobalTransactionId:
    name:  x-ned-transaction-id
    in: header
    required: true
    type: string
    format: uuid
    description: a transaction id initiated from the front-end
  TenantCode:
    name: x-ned-tenant-code
    in: header
    required: true
    type: string
    description:  "For example: ZANBL = Nedbank Limited, ZADIL = Depfin Investments Proprietary Limited"
security:
- API Key: []
  API Secret: []
paths:
  /accounttypes/{accounttype}/accounts/{accountnumber}/financials/transactions:
    post:
      tags:
      - CreateFinancialTransaction
      summary: Post a financial transaction against an account
      description: Create a debit or credit financial transaction against an account
      operationId: CreateFinancialTransaction
      parameters:
      - $ref: '#/parameters/AcceptLanguage'
      - $ref: '#/parameters/GlobalTransactionId'
      - $ref: '#/parameters/TenantCode'
      - name: accounttype
        in: path
        required: true
        description: |-
          Account Type classifies the valid set of Account Arrangements
          NCA - Current account
          NSA - Savings account
          NDS - Investmant Account
        type: string
        minLength: 3
        maxLength: 3
      - name: accountnumber
        in: path
        required: true
        description: |-
          Unique Identifier for the account type within the relevant source system
          Account number
        type: string
        minLength: 23
        maxLength: 23
      - name: createfintranrequest
        in: body
        required: true
        description: The details of the financial transaction
        schema:
          $ref: '#/definitions/CreateFinTranRequest'
      responses:
        201:
          description: Created. Request successfully executed
          schema:
            $ref: '#/definitions/CreateFinTranResponse'
  /accounttypes/{accounttype}/accounts/{accountnumber}/financials/statuses/enquiries:
    post:
      tags:
      - GetAccountFinancialStatus
      summary: Verify the financial status of an account
      description: Verify the financial status of an account, transactions allowed,
        debit/credit allowed
      operationId: GetAccountFinancialStatus
      parameters:
      - $ref: '#/parameters/AcceptLanguage'
      - $ref: '#/parameters/GlobalTransactionId'
      - $ref: '#/parameters/TenantCode'
      - name: accounttype
        in: path
        required: true
        description: |-
          Account Type classifies the valid set of Account Arrangements
          NCA - Current account
          NSA - Savings account
          NDS - Investmant Account
        type: string
        minLength: 3
        maxLength: 3
      - name: accountnumber
        in: path
        required: true
        description: |-
          Unique Identifier for the account type within the relevant source system
          Account number
        type: string
        minLength: 23
        maxLength: 23
      - name: getAccountFinancialStatus
        in: body
        required: true
        schema:
          $ref: '#/definitions/GetAccountFinancialStatusRequest'      
      responses:
        201:
          description: Created. Request successfully executed
          schema:
            $ref: '#/definitions/GetAcctFinStatusResponse'
  /accounttypes/{accounttype}/accounts/{accountnumber}/financials/trackings/cancelations:
    post:
      tags:
        - CancelTracking
      description: CancelTracking
      operationId: CancelTracking
      parameters:
      - $ref: '#/parameters/AcceptLanguage'
      - $ref: '#/parameters/GlobalTransactionId'
      - $ref: '#/parameters/TenantCode'
      - name: accounttype
        in: path
        required: true
        description: |-
          Account Type classifies the valid set of Account Arrangements
          NCA - Current account
          NSA - Savings account
          NDS - Investmant Account
        type: string
        minLength: 3
        maxLength: 3
      - name: accountnumber
        in: path
        required: true
        description: |-
          Unique Identifier for the account type within the relevant source system
          Account number
        type: string
        minLength: 23
        maxLength: 23
      - name: CancelTracking
        in: body
        required: true
        schema:
          $ref: '#/definitions/CancelTrackingRequest'
      responses:
        201:
          description: 'Created'
          schema:
            $ref: '#/definitions/CancelTrackingResponse'
definitions:
  CancelTrackingRequest:
    required:
      - creditTrackingStrikeDate
      - paymentId
      - sourceSystem
    type: object
    properties:
      creditTrackingStrikeDate:
        type: string
        format: date
        minLength: 10
        maxLength: 10        
      paymentId:
        $ref: '#/definitions/PaymentId'
      sourceSystem:
        $ref: '#/definitions/System_Type'
  CancelTrackingResponse:
    required:
      - resultSet
    type: object
    properties:
      resultSet:
        $ref: '#/definitions/ResultSet'
      accountType:
        type: string
        minLength: 3
        maxLength: 3
      accountNo:
        $ref: '#/definitions/AccountNo'
      paymentId:
        $ref: '#/definitions/PaymentId'
      sourceSystem:
        $ref: '#/definitions/System_Type'
      creditTrackingStrikeDate:
        type: string
        format: date
  AccountNo:
    description: Unique Identifier for an account that is part of the transfer.
    type: string
  PaymentId:
    type: string    
  GetAccountFinancialStatusRequest:
    required:
      - accountPayment
      - transactionValidationInstruction
    type: object
    properties:
      paymentType:
        $ref: '#/definitions/CodeDescription_Type'
      transactionValidationInstruction:
        $ref: '#/definitions/TransactionValidationInstruction_Type'
      externalChannel:
        $ref: '#/definitions/CodeDescription_Type'
      productSystem:
        $ref: '#/definitions/ProductSystem_Type'
      tranCodeSourceSystem:
        $ref: '#/definitions/System_Type'
      unpaidPayment:
        $ref: '#/definitions/UnpaidPayment_Type'
      clientIdentification:
        $ref: '#/definitions/ClientIdentifications'
      additionalInformation:
        $ref: '#/definitions/AdditionalInformation'
  AdditionalInformation:
    type: array
    items:
      $ref: '#/definitions/AdditionalProperty'
  AdditionalProperty:
    description: |-
      A property-value pair representing an additional characteristics of the entitity, e.g. a product feature or another characteristic for which there is no matching property in schema.org.
      Note: Publishers should be aware that applications designed to use specific schema.org properties (e.g. http://schema.org/width, http://schema.org/color, http://schema.org/gtin13, ...) will typically expect such data to be provided using those properties, rather than using the generic property/value mechanism
    type: object
    properties:
      context:
        type: string
        minLength: 100
        maxLength: 100      
      value:
        type: string
        minLength: 100
        maxLength: 100      
  TransactionValidationInstruction_Type:
    required:
      - transactionEffect
      - transactionValidationType
    type: object
    properties:
      transactionValidationType:
        $ref: '#/definitions/CodeDescription_Type'
      transactionType:
        $ref: '#/definitions/CodeDescription_Type'
      transactionAmount:
        $ref: '#/definitions/Amount_Type'
      transactionEffect:
        $ref: '#/definitions/TransactionEffect'
      entryClassificationType:
        $ref: '#/definitions/CodeDescription_Type'
      interbankTransactionFlag:
        type: boolean
  TransactionEffect:
    description: "It is used to determine where to put the amount - which column (sign) for transaction instruction request.\r\n"
    type: object
    properties:
      value:
        type: string
        minLength: 3
        maxLength: 3
  ClientIdentification:
    type: object
    properties:
      clientIdentifier:
        $ref: '#/definitions/ClientIdentifier'
      clientIdType:
        $ref: '#/definitions/CodeDescription_Type'        
  ClientIdentifier:
    description: This identifier contains the unique number or code used to uniquely or form part of a unique identifier used to identify a business object at an enterprise level.&lt;br&gt;For Example, a FinancialTransactionCard contains both a Card Number and a CCV number.&lt;br&gt;This Identifier is used in conjunction with its EnterpriseIdentifier subclass. The EnterpriseIdentifier subclass contains a enterpriseIdType which must be used to specify the type of the identifier.&lt;br&gt;For Example, FinancialDocumentIdentifier.enterpriseIdType.FinTransCardCCV. FinancialDocumentIdentifier inherits from EnterpriseIdentifier.
    type: string
    minLength: 36
    maxLength: 36
  Amount_Type:
