    type: object
    properties:
      resultCode:
        description: A short code indicating the outcome of the operation. The list of
          codes will be defined per service
        type: string
        minLength: 4
        maxLength: 4
      resultDescription:
        description: A detailed description explaining the outcome of the operation. It
          must be used to return messages that can help troubleshooting error scenarios.
        type: string
        minLength: 1
        maxLength: 100
    required:
    - resultCode
  UserIdentificationList:
    description: |-
      A list of user of involved with the transaction
      userIdentifier contains the employee number for the specified user type where userIdType =
      "Approving Employee Number" - Employee 2 (Approver)
      "Capturing Employee Number" - Employee 1 (Capturer)
    type: array
    items:
      $ref: '#/definitions/UserIdentification'
    minItems: 0
    maxItems: 2
